# ==============================================================
# DESPLIEGUE EN VM PROPIA (Hetzner) — topología REDUCIDA
#   mysql (interno) + 1 backend (interno) + 1 frontend (única entrada)
#
#   docker compose -f docker-compose.hetzner.yml --env-file .env.hetzner up -d --build
#
# Diferencias con docker-compose.yml (3+3+LB):
#   - 1 backend y 1 frontend en vez de 3+3, sin balanceador Apache: en una sola
#     VM el LB no da alta disponibilidad real (si cae la VM, cae todo) y el
#     bloqueo antifuerza bruta del login es un mapa EN MEMORIA por instancia,
#     que solo es consistente con un backend.
#   - Incluye el MySQL de las DOS bases (gestionturnos + innhosp), porque las
#     BD de la red del hospital (10.6.15.x) no son alcanzables desde la nube.
#   - Sin puertos de BD publicados: MySQL solo existe dentro de la red Docker.
#   - Límites de memoria explícitos para convivir con el otro sistema de la VM.
# ==============================================================
name: sgt-huap

services:
  mysql:
    image: mysql:8.0
    container_name: sgt-mysql
    restart: always
    command:
      - --innodb-buffer-pool-size=192M
      - --max-connections=80
      - --performance-schema=OFF
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:?define MYSQL_ROOT_PASSWORD en .env.hetzner}
    volumes:
      - mysql_data:/var/lib/mysql
      # Scripts SQL en solo lectura: los aplica scripts/init_db.sh, no el entrypoint.
      - ./BaseDatosMySQL:/sql:ro
    # Sin "ports": la BD NO se expone a internet. Acceso solo por la red interna
    # o vía "docker compose exec mysql mysql -u root -p".
    networks:
      - sgt-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    mem_limit: 640m
    logging:
      driver: "json-file"
      options: { max-size: "10m", max-file: "3" }

  backend:
    build:
      context: ./huap_backend
      dockerfile: Dockerfile
    image: sgt-backend:latest
    container_name: sgt-backend
    restart: always
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    environment:
      # La JVM respeta el mem_limit del contenedor vía MaxRAMPercentage.
      - JAVA_TOOL_OPTIONS=-XX:MaxRAMPercentage=70 -XX:+UseSerialGC
      - DB_URL=jdbc:mysql://mysql:3306/gestionturnos?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Santiago
      - DB_USERNAME=${DB_USERNAME:?define DB_USERNAME en .env.hetzner}
      - DB_PASSWORD=${DB_PASSWORD:?define DB_PASSWORD en .env.hetzner}
      - HOSPITAL_DB_URL=jdbc:mysql://mysql:3306/innhosp?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Santiago
      - HOSPITAL_DB_USERNAME=${HOSPITAL_DB_USERNAME:?define HOSPITAL_DB_USERNAME en .env.hetzner}
      - HOSPITAL_DB_PASSWORD=${HOSPITAL_DB_PASSWORD:?define HOSPITAL_DB_PASSWORD en .env.hetzner}
      - DDL_AUTO=validate
      - JWT_SECRET=${JWT_SECRET:?define JWT_SECRET en .env.hetzner}
      - SWAGGER_ENABLED=false
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:?define CORS_ALLOWED_ORIGINS en .env.hetzner}
      - LOGIN_LOCK_DURATION_MS=${LOGIN_LOCK_DURATION_MS:-900000}
      - SERVER_ID=hetzner-1
    expose:
      - "8080"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - sgt-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/api/v2/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    mem_limit: 1g
    logging:
      driver: "json-file"
      options: { max-size: "10m", max-file: "3" }

  frontend:
    build:
      context: ./sgt-huap_frontend
      dockerfile: Dockerfile
      args:
        # Relativa: el propio httpd hace de proxy de /api/v2 hacia el backend,
        # así el navegador habla siempre con un único origen (sin CORS).
        - VITE_API_BASE_URL=/api/v2
    image: sgt-frontend:latest
    container_name: sgt-frontend
    restart: always
    # httpd arranca como root para bindear el 80 y baja los workers a "daemon":
    # necesita NET_BIND_SERVICE + SETUID/SETGID (misma nota que docker-compose.yml).
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE, SETUID, SETGID]
    security_opt:
      - no-new-privileges:true
    ports:
      # PUBLIC_BIND=127.0.0.1 si delante hay un reverse proxy en la VM (recomendado).
      # PUBLIC_BIND=0.0.0.0 para exponer directo por IP:puerto.
      - "${PUBLIC_BIND:-127.0.0.1}:${PUBLIC_PORT:-8090}:80"
    volumes:
      # Agrega el proxy reverso /api/v2 -> backend:8080 sobre la conf del Dockerfile.
      - ./apache/dev/httpd.conf:/usr/local/apache2/conf/httpd.conf:ro
    depends_on:
      - backend
    networks:
      - sgt-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    mem_limit: 128m
    logging:
      driver: "json-file"
      options: { max-size: "10m", max-file: "3" }

networks:
  sgt-network:
    driver: bridge

volumes:
  mysql_data:
