spring.application.name=SGTHUAP
server.port=8080

# --- CONFIGURACION DE BASE DE DATOS ---
spring.datasource.url=jdbc:mysql://localhost:3306/innhosp2
spring.datasource.username=root
spring.datasource.password=***PURGADO***
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- COMPORTAMIENTO DE HIBERNATE ---
spring.jpa.hibernate.ddl-auto=update

# Mantiene los nombres tal cual estan escritos (evita los guiones bajos)
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# --- SEGURIDAD JWT ---
app.jwt.secret=***JWT_SECRET_PURGADO***
app.jwt.expiration=86400000

# Logging
logging.level.com.pingeso.HUAP.Security=DEBUG