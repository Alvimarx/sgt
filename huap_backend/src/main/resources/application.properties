spring.application.name=SGTHUAP
server.port=8080

# --- CONFIGURACION DE BASE DE DATOS ---
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:3306/innhosp
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- COMPORTAMIENTO DE HIBERNATE ---
# En Docker sera 'none'. En tu PC sera 'update'.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}

# Mantiene los nombres tal cual estan escritos (evita los guiones bajos)
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# --- SEGURIDAD JWT ---
app.jwt.secret=${JWT_SECRET:***JWT_SECRET_PURGADO***}
app.jwt.expiration=86400000

# Logging
logging.level.com.pingeso.HUAP.Security=DEBUG