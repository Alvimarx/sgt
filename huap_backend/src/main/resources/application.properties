spring.application.name=SGTHUAP
server.port=8080

# --- BD PROPIA DEL SGT (gestionturnos) — datasource PRIMARIO ---
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- BD DEL HOSPITAL — datasource SECUNDARIO, SOLO LECTURA (vista viewPersonal) ---
hospital.datasource.url=${HOSPITAL_DB_URL}
hospital.datasource.username=${HOSPITAL_DB_USERNAME}
hospital.datasource.password=${HOSPITAL_DB_PASSWORD}
hospital.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
hospital.datasource.hikari.read-only=true
hospital.datasource.hikari.maximum-pool-size=3

# --- COMPORTAMIENTO DE HIBERNATE  ---
spring.jpa.hibernate.ddl-auto=${DDL_AUTO}
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# --- SEGURIDAD JWT ---
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=86400000

# Logging
logging.level.com.pingeso.HUAP.Security=INFO

# --- OpenAPI / Swagger UI ---
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.api-docs.path=/v3/api-docs