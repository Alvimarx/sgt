spring.application.name=SGTHUAP
server.port=8080

# --- CONFIGURACION DE BASE DE DATOS ---
# DB_HOST/DB_PORT/DB_USERNAME/DB_PASSWORD permiten sobreescribir estos valores
# via variables de entorno (ver docker-compose.yml); si no se definen, se usan
# los valores por defecto para desarrollo local sin Docker.
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/innhosp2
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:1234$}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- COMPORTAMIENTO DE HIBERNATE ---
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}

# Mantiene los nombres tal cual estan escritos (evita los guiones bajos)
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# --- SEGURIDAD JWT ---
app.jwt.secret=${JWT_SECRET:***JWT_SECRET_PURGADO***}
app.jwt.expiration=86400000

# Logging
logging.level.com.pingeso.HUAP.Security=INFO

# --- OpenAPI / Swagger UI ---
# Habilitado por defecto (desarrollo). En PRODUCCION se apaga con SWAGGER_ENABLED=false
# (ver docker-compose.yml) para no exponer la documentacion de la API.
springdoc.api-docs.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.api-docs.path=/v3/api-docs