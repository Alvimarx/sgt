# =====================================================
# RATE LIMITING PARA APACHE
# Archivo: conf.d/rate_limiting.conf
# =====================================================
# 
# NOTA: Apache no tiene rate limiting nativo tan avanzado como nginx
# Se necesitaría compilar con mod_evasive o mod_qos
# 
# Para producción, considera usar mod_evasive:
# https://github.com/jzdziarski/mod_evasive
#
# Instalación en Alpine:
# apk add apache2-mod-evasive
# 
# Configuración equivalente a nginx:
# limit_req_zone $binary_remote_addr zone=req_per_ip:10m rate=50r/s;
# limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/s;
# limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;
# =====================================================

# Si mod_evasive está disponible, descomentar:
# <IfModule mod_evasive24.c>
#     # Número de peticiones al mismo URI en 1 segundo antes de bloquear
#     DOSPageCount 50
#     
#     # Intervalo para DOSPageCount
#     DOSPageInterval 1
#     
#     # Número de peticiones al mismo sitio en 1 segundo antes de bloquear
#     DOSSiteCount 100
#     
#     # Intervalo para DOSSiteCount
#     DOSSiteInterval 1
#     
#     # Período de bloqueo (segundos)
#     DOSBlockingPeriod 10
#     
#     # Email para notificaciones (opcional)
#     # DOSEmailNotify admin@example.com
#     
#     # Whitelist (IPs que no se bloquean)
#     DOSWhitelist 127.0.0.1
#     DOSWhitelist 10.*
#     DOSWhitelist 172.17.*
# </IfModule>

# Alternativa básica con mod_ratelimit (limita ancho de banda, no requests)
<IfModule mod_ratelimit.c>
    # Esto limita el ancho de banda, no el número de requests
    # 400 KB/s por conexión
    # SetOutputFilter RATE_LIMIT
    # SetEnv rate-limit 400
</IfModule>

# Para rate limiting avanzado por requests, se recomienda:
# 1. Usar un WAF como ModSecurity
# 2. Usar mod_qos (Quality of Service)
# 3. Usar proxy reverso con capacidades de rate limiting (como nginx delante)
# 4. Usar CloudFlare u otro CDN con rate limiting

# =====================================================
# EQUIVALENCIAS NGINX -> APACHE
# =====================================================
# 
# NGINX:
# limit_req_zone $binary_remote_addr zone=req_per_ip:10m rate=50r/s;
# limit_req zone=req_per_ip burst=100 nodelay;
#
# APACHE (con mod_evasive):
# DOSSiteCount 50
# DOSSiteInterval 1
#
# NGINX:
# limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;
# limit_conn conn_per_ip 50;
#
# APACHE (con mod_qos):
# QS_SrvMaxConnPerIP 50
#
# =====================================================
