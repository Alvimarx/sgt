# =====================================================
# UPSTREAM: BACKEND API (Spring Boot × 3)
# Archivo: conf.d/upstreams/backend.conf
# Equivalente a nginx upstream backend_api
# =====================================================

# -------------------------------------------------
# BALANCER: backend_api
# -------------------------------------------------
# Algoritmo: bybusyness
# Envía peticiones al servidor con menos conexiones activas
# Ideal para APIs donde las peticiones pueden tener tiempos variables

<Proxy "balancer://backend_api">
    # -------------------------------------------------
    # SERVIDORES BACKEND
    # -------------------------------------------------
    # retry: tiempo que permanece marcado como down (equivalente a fail_timeout)
    # connectiontimeout: timeout de conexión
    # timeout: timeout de lectura/escritura
    # loadfactor: peso relativo (equivalente a weight, mayor = más peticiones)
    
    BalancerMember "http://backend-1:8080" loadfactor=1 retry=30 connectiontimeout=5 timeout=60
    BalancerMember "http://backend-2:8080" loadfactor=1 retry=30 connectiontimeout=5 timeout=60
    BalancerMember "http://backend-3:8080" loadfactor=1 retry=30 connectiontimeout=5 timeout=60
    
    # -------------------------------------------------
    # CONFIGURACIÓN DEL BALANCER
    # -------------------------------------------------
    # lbmethod=bybusyness: equivalente a least_conn de nginx
    # Otras opciones: byrequests (round-robin), bytraffic
    ProxySet lbmethod=bybusyness
    
    # Sticky session por JSESSIONID (útil para aplicaciones con estado)
    ProxySet stickysession=JSESSIONID|jsessionid
    
    # Número máximo de reintentos (equivalente a proxy_next_upstream_tries)
    ProxySet failonstatus=500,502,503
    
    # -------------------------------------------------
    # CONEXIONES PERSISTENTES (Keep-Alive)
    # -------------------------------------------------
    # Nota: keepalive y enablereuse no son parámetros válidos en Apache 2.4-alpine
    # El balancer usa conexiones persistentes por defecto
</Proxy>
