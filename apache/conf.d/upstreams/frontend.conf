# =====================================================
# UPSTREAM: FRONTEND SERVERS (React/Vite × 3)
# Archivo: conf.d/upstreams/frontend.conf
# =====================================================

# -------------------------------------------------
# BALANCER: frontend_servers
# -------------------------------------------------
# Algoritmo: byrequests con sticky session
# Equivalente a ip_hash de nginx - mismo usuario va al mismo servidor

<Proxy "balancer://frontend_servers">
    # -------------------------------------------------
    # SERVIDORES FRONTEND
    # -------------------------------------------------
    # loadfactor: peso relativo (equivalente a weight)
    # retry: tiempo que permanece marcado como down (equivalente a fail_timeout)
    # route: identificador para sticky sessions
    
    BalancerMember "http://frontend-1:80" loadfactor=1 retry=30 route=f1
    BalancerMember "http://frontend-2:80" loadfactor=1 retry=30 route=f2
    BalancerMember "http://frontend-3:80" loadfactor=1 retry=30 route=f3
    
    # -------------------------------------------------
    # CONFIGURACIÓN DEL BALANCER
    # -------------------------------------------------
    # lbmethod=byrequests: round-robin básico
    ProxySet lbmethod=byrequests
    
    # Sticky session por cookie ROUTEID (equivalente a ip_hash)
    # El usuario siempre irá al mismo servidor frontend
    ProxySet stickysession=ROUTEID
    
    # Reintentos en caso de fallo
    ProxySet failonstatus=500,502,503
    
    # -------------------------------------------------
    # CONEXIONES PERSISTENTES (Keep-Alive)
    # -------------------------------------------------
    # Nota: keepalive y enablereuse no son parámetros válidos en Apache 2.4-alpine
    # El balancer usa conexiones persistentes por defecto
</Proxy>
