# =====================================================
# LOCATION: FRONTEND (React/Vite)
# Archivo: conf.d/locations/frontend.conf
# Maneja archivos estáticos y SPA routing
# =====================================================

# =====================================================
# LOCATION: ASSETS ESTÁTICOS CON CACHE LARGO
# =====================================================
<LocationMatch "\.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$">
    ProxyPreserveHost On
    ProxyPass "balancer://frontend_servers"
    ProxyPassReverse "balancer://frontend_servers"
    
    # HTTP/1.1 para keep-alive
    RequestHeader unset Connection
    
    # -------------------------------------------------
    # CACHE DE ARCHIVOS ESTÁTICOS
    # -------------------------------------------------
    <IfModule mod_expires.c>
        ExpiresActive On
        ExpiresDefault "access plus 1 year"
    </IfModule>
    
    <IfModule mod_headers.c>
        Header set Cache-Control "public, immutable"
    </IfModule>
</LocationMatch>

# =====================================================
# LOCATION: FRONTEND PRINCIPAL (/)
# =====================================================
ProxyPreserveHost On

# Headers globales para todo lo que no sea API o health
RequestHeader set X-Real-IP "%{REMOTE_ADDR}s"
# SEC (M-12): ver api.conf — "%{X-Forwarded-For}s" no es una variable válida y pisaba el
# valor real que agrega mod_proxy_http; se quita para no falsear la IP del cliente.
RequestHeader set X-Forwarded-Proto "%{REQUEST_SCHEME}s"

# Proxy al frontend como default (después de que /api/ y /health hayan sido procesados)
# Esto solo aplica si no matcheó ninguna Location anterior
ProxyPass "/" "balancer://frontend_servers/"
ProxyPassReverse "/" "balancer://frontend_servers/"
