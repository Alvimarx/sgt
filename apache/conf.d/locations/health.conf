# =====================================================
# LOCATION: HEALTH CHECKS Y MONITOREO
# Archivo: conf.d/locations/health.conf
# Endpoints para Docker/Kubernetes healthchecks
# =====================================================

# -------------------------------------------------
# HEALTH CHECK PRINCIPAL (para Docker)
# -------------------------------------------------
<Location "/health">
    # Sin logging para health checks
    SetEnvIf Request_URI "^/health$" no-log
    
    # Respuesta simple
    SetHandler server-status
    
    # Accesible desde cualquier lugar
    Require all granted
    
    # Retornar texto plano
    Header set Content-Type "text/plain"
</Location>

# Alias para apache-health 
<Location "/apache-health">
    # Sin logging
    SetEnvIf Request_URI "^/apache-health$" no-log
    
    Require all granted
    Header set Content-Type "text/plain"
    
    # Respuesta directa (se maneja en el script o rewrite)
</Location>

# -------------------------------------------------
# APACHE STATUS (métricas básicas)
# -------------------------------------------------
<Location "/server-status">
    SetHandler server-status

    # Sin logging
    SetEnvIf Request_URI "^/server-status$" no-log

    # SEC (H-09): antes accesible sin restricción — filtraba IPs de clientes, URLs en
    # curso y topología interna a cualquiera en Internet. Solo red interna del compose.
    Require local
    Require ip 10.55.0.0/16
</Location>

# -------------------------------------------------
# READY CHECK (verifica backends)
# -------------------------------------------------
<Location "/ready">
    # Sin logging
    SetEnvIf Request_URI "^/ready$" no-log
    
    # Proxy al health del backend
    ProxyPass "balancer://backend_api/api/v1/health"
    ProxyPassReverse "balancer://backend_api/api/v1/health"
</Location>

# -------------------------------------------------
# BALANCER MANAGER (opcional, para debug)
# Permite ver y gestionar el estado de los balancers
# -------------------------------------------------
<Location "/balancer-manager">
    SetHandler balancer-manager

    # SEC (H-09): este panel acepta POST para deshabilitar/drenar miembros del balanceador —
    # dejarlo abierto es una DoS trivial sin autenticación. Solo red interna del compose.
    Require local
    Require ip 10.55.0.0/16
</Location>
