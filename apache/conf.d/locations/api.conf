# =====================================================
# LOCATION: API BACKEND
# Archivo: conf.d/locations/api.conf
# Maneja todas las rutas /api/*
# Equivalente a nginx locations/api.conf
# =====================================================

# -------------------------------------------------
# WEBSOCKETS (si se necesitan)
# -------------------------------------------------
# RewriteEngine debe estar habilitado en el VirtualHost principal

# Detectar peticiones WebSocket y redirigir apropiadamente
RewriteCond %{HTTP:Upgrade} =websocket [NC]
RewriteCond %{REQUEST_URI} ^/api/ws/ [NC]
RewriteRule ^/api/ws/(.*)$ "ws://backend-1:8080/api/ws/$1" [P,L]

# Fallback para conexiones que no son websocket pero van a /api/ws/
RewriteCond %{HTTP:Upgrade} !=websocket [NC]
RewriteCond %{REQUEST_URI} ^/api/ws/ [NC]
RewriteRule ^/api/ws/(.*)$ "http://backend-1:8080/api/ws/$1" [P,L]

# -------------------------------------------------
# PROXY AL BACKEND PARA /api/
# -------------------------------------------------
<Location "/api/">
    # -------------------------------------------------
    # RATE LIMITING
    # -------------------------------------------------
    # Nota: Apache no tiene rate limiting nativo tan avanzado como nginx
    # Se puede usar mod_ratelimit para limitar ancho de banda
    # Para rate limiting por requests, se necesita mod_evasive o mod_qos
    # SetOutputFilter RATE_LIMIT
    # SetEnv rate-limit 400
    
    # -------------------------------------------------
    # PROXY AL BACKEND
    # -------------------------------------------------
    ProxyPreserveHost On
    ProxyPass "balancer://backend_api/api/"
    ProxyPassReverse "balancer://backend_api/api/"
    
    # -------------------------------------------------
    # HEADERS PARA EL BACKEND
    # -------------------------------------------------
    RequestHeader set X-Real-IP "%{REMOTE_ADDR}s"
    # SEC (M-12): "%{X-Forwarded-For}s" NO es una variable de servidor válida — este "set"
    # sobrescribía (con un valor vacío/incorrecto) el X-Forwarded-For que mod_proxy_http ya
    # añade automáticamente con la IP real del cliente, permitiendo falsear la IP que ve el
    # backend (usada por el bloqueo antifuerza bruta y por los logs de auditoría). Se quita
    # y se deja que mod_proxy_http lo gestione de forma nativa.
    RequestHeader set X-Forwarded-Proto "%{REQUEST_SCHEME}s"
    RequestHeader set X-Request-ID "%{UNIQUE_ID}e"
    
    # Limpiar header Connection para keep-alive
    RequestHeader unset Connection
</Location>
