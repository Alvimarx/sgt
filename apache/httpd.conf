# =====================================================
# APACHE HTTP SERVER - CONFIGURACIÓN PRINCIPAL
# =====================================================

# Configuración del servidor
ServerRoot "/usr/local/apache2"
Listen 80

# =====================================================
# MÓDULOS
# =====================================================

# Módulos core
LoadModule mpm_event_module modules/mod_mpm_event.so
LoadModule authn_core_module modules/mod_authn_core.so
LoadModule authz_core_module modules/mod_authz_core.so
LoadModule access_compat_module modules/mod_access_compat.so
LoadModule log_config_module modules/mod_log_config.so
LoadModule env_module modules/mod_env.so
LoadModule headers_module modules/mod_headers.so
LoadModule setenvif_module modules/mod_setenvif.so
LoadModule mime_module modules/mod_mime.so
LoadModule unixd_module modules/mod_unixd.so
LoadModule status_module modules/mod_status.so
LoadModule dir_module modules/mod_dir.so
LoadModule alias_module modules/mod_alias.so
LoadModule rewrite_module modules/mod_rewrite.so
LoadModule filter_module modules/mod_filter.so
LoadModule unique_id_module modules/mod_unique_id.so

# Módulos de compresión 
LoadModule deflate_module modules/mod_deflate.so

# Módulos de cache
LoadModule expires_module modules/mod_expires.so

# Módulos para proxy y load balancing
LoadModule proxy_module modules/mod_proxy.so
LoadModule proxy_http_module modules/mod_proxy_http.so
LoadModule proxy_wstunnel_module modules/mod_proxy_wstunnel.so
LoadModule proxy_balancer_module modules/mod_proxy_balancer.so
LoadModule slotmem_shm_module modules/mod_slotmem_shm.so
LoadModule lbmethod_byrequests_module modules/mod_lbmethod_byrequests.so
LoadModule lbmethod_bybusyness_module modules/mod_lbmethod_bybusyness.so

# Rate limiting 
LoadModule ratelimit_module modules/mod_ratelimit.so

# Watchdog para health checks
LoadModule watchdog_module modules/mod_watchdog.so

# =====================================================
# CONFIGURACIÓN DE USUARIO
# =====================================================
<IfModule unixd_module>
    User daemon
    Group daemon
</IfModule>

# =====================================================
# CONFIGURACIÓN BÁSICA
# =====================================================

# Ocultar versión de Apache (seguridad)
ServerTokens Prod
ServerSignature Off

# Nombre del servidor
ServerName localhost

# PidFile 
PidFile /usr/local/apache2/logs/httpd.pid

# =====================================================
# LOGGING
# =====================================================

# Formato main 
LogFormat "%h %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\" \"%{X-Forwarded-For}i\" upstream: %{BALANCER_WORKER_NAME}e rt: %D" main

# Formato JSON 
LogFormat "{\"time\":\"%{%Y-%m-%dT%H:%M:%S%z}t\",\"remote_addr\":\"%h\",\"request\":\"%r\",\"status\":\"%>s\",\"body_bytes_sent\":\"%b\",\"upstream_addr\":\"%{BALANCER_WORKER_NAME}e\",\"upstream_response_time\":\"%D\",\"request_time\":\"%D\"}" json

# Archivos de log
ErrorLog "/usr/local/apache2/logs/error.log"
CustomLog "/usr/local/apache2/logs/access.log" main env=!no-log

# Nivel de log 
LogLevel warn

# =====================================================
# OPTIMIZACIÓN DE RENDIMIENTO
# =====================================================

# Configuración de MPM Event
# Equivalente a worker_processes y worker_connections
<IfModule mpm_event_module>
    StartServers             3
    MinSpareThreads         75
    MaxSpareThreads        250
    ThreadsPerChild         25
    MaxRequestWorkers      400
    MaxConnectionsPerChild   0
</IfModule>

# Timeouts 
# Equivalente a keepalive_timeout 65
Timeout 60
KeepAlive On
MaxKeepAliveRequests 1000
KeepAliveTimeout 65

# Tamaño máximo de cuerpo (equivalente a client_max_body_size 50m)
LimitRequestBody 52428800

# Buffers (equivalente a client_body_buffer_size, etc)
LimitRequestFieldSize 32768
LimitRequestFields 100

# =====================================================
# COMPRESIÓN GZIP
# =====================================================
<IfModule mod_deflate.c>
    SetOutputFilter DEFLATE
    
    # No comprimir archivos ya comprimidos
    SetEnvIfNoCase Request_URI \.(?:gif|jpe?g|png|zip|gz|bz2)$ no-gzip
    
    # Tipos a comprimir 
    AddOutputFilterByType DEFLATE text/plain
    AddOutputFilterByType DEFLATE text/css
    AddOutputFilterByType DEFLATE text/xml
    AddOutputFilterByType DEFLATE text/html
    AddOutputFilterByType DEFLATE application/json
    AddOutputFilterByType DEFLATE application/javascript
    AddOutputFilterByType DEFLATE application/xml
    AddOutputFilterByType DEFLATE application/xml+rss
    AddOutputFilterByType DEFLATE application/atom+xml
    AddOutputFilterByType DEFLATE image/svg+xml
    
    # Nivel de compresión 
    DeflateCompressionLevel 6
    
    # Tamaño mínimo 
    SetEnvIfNoCase Content-Length "^[0-9]{1,3}$" no-gzip
</IfModule>

# =====================================================
# TIPOS MIME
# =====================================================
TypesConfig conf/mime.types
AddType application/javascript .js
AddType text/css .css
AddType image/svg+xml .svg
AddType application/json .json

# =====================================================
# HEADERS DE SEGURIDAD
# =====================================================
<IfModule mod_headers.c>
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-XSS-Protection "1; mode=block"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
</IfModule>

# =====================================================
# RATE LIMITING (Protección DDoS)
# =====================================================
# Nota: Apache usa mod_ratelimit para bandwidth limiting
# Para rate limiting por requests se necesita mod_evasive o mod_qos
# Configuración básica con mod_ratelimit:
# SetOutputFilter RATE_LIMIT
# SetEnv rate-limit 400

# Respuesta cuando se excede el límite (equivalente a limit_req_status 429)
# Se maneja vía ErrorDocument

# =====================================================
# STATUS EXTENDIDO
# =====================================================
ExtendedStatus On

# =====================================================
# INCLUIR UPSTREAMS (Servidores Backend y Frontend)
# =====================================================
IncludeOptional conf/conf.d/upstreams/*.conf

# =====================================================
# SERVIDOR PRINCIPAL (Puerto 80)
# =====================================================
<VirtualHost *:80>
    ServerName localhost
    ServerAlias *
    
    DocumentRoot "/usr/local/apache2/htdocs"
    
    # Habilitar motor de rewrite (necesario para WebSocket y redirects)
    RewriteEngine On
    
    # =====================================================
    # INCLUIR LOCATIONS (API, Frontend, Health)
    # =====================================================
    
    # IMPORTANTE: El orden importa en Apache
    # 1. Health checks primero
    IncludeOptional conf/conf.d/locations/health.conf
    
    # 2. API backend
    IncludeOptional conf/conf.d/locations/api.conf
    
    # 3. Frontend (catch-all) al final
    IncludeOptional conf/conf.d/locations/frontend.conf
    
    # =====================================================
    # MANEJO DE ERRORES
    # =====================================================
    ErrorDocument 500 "Internal Server Error"
    ErrorDocument 502 "Bad Gateway"
    ErrorDocument 503 "Service Unavailable"
    ErrorDocument 504 "Gateway Timeout"
    ErrorDocument 429 "{\"error\": \"Too Many Requests\", \"message\": \"Por favor espere un momento\", \"retry_after\": 1}"

</VirtualHost>

