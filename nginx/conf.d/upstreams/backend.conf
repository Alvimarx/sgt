# =====================================================
# UPSTREAM: BACKEND API (Spring Boot × 3)
# Archivo: conf.d/upstreams/backend.conf
# =====================================================

upstream backend_api {
    # Algoritmo: least_conn
    # Envía peticiones al servidor con menos conexiones activas
    # Ideal para APIs donde las peticiones pueden tener tiempos variables
    least_conn;
    
    # -------------------------------------------------
    # SERVIDORES BACKEND
    # -------------------------------------------------
    # weight: peso relativo (mayor = más peticiones)
    # max_fails: intentos fallidos antes de marcar como down
    # fail_timeout: tiempo que permanece marcado como down
    
    server backend-1:8080 weight=1 max_fails=3 fail_timeout=30s;
    server backend-2:8080 weight=1 max_fails=3 fail_timeout=30s;
    server backend-3:8080 weight=1 max_fails=3 fail_timeout=30s;
    
    # -------------------------------------------------
    # CONEXIONES PERSISTENTES (Keep-Alive)
    # -------------------------------------------------
    # Mantiene 64 conexiones abiertas al backend
    # Reduce latencia al reutilizar conexiones TCP
    keepalive 64;
    
    # Tiempo máximo que una conexión puede estar idle
    keepalive_timeout 60s;
    
    # Máximo de peticiones por conexión keep-alive
    keepalive_requests 1000;
}

