# =====================================================
# UPSTREAM: FRONTEND SERVERS (React/Vite × 3)
# Archivo: conf.d/upstreams/frontend.conf
# =====================================================

upstream frontend_servers {
    # Algoritmo: ip_hash
    # El mismo usuario siempre va al mismo servidor (sticky sessions)
    # Útil para mantener consistencia en caché del navegador
    ip_hash;
    
    # -------------------------------------------------
    # SERVIDORES FRONTEND
    # -------------------------------------------------

    server frontend-1:80 weight=1 max_fails=3 fail_timeout=30s;
    server frontend-2:80 weight=1 max_fails=3 fail_timeout=30s;
    server frontend-3:80 weight=1 max_fails=3 fail_timeout=30s;
    
    # -------------------------------------------------
    # CONEXIONES PERSISTENTES (Keep-Alive)
    # -------------------------------------------------
    # Mantiene 32 conexiones abiertas a los frontends
    keepalive 32;
    
    # Tiempo máximo idle para conexiones keep-alive
    keepalive_timeout 60s;
}
