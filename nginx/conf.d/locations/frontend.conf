# =====================================================
# LOCATION: FRONTEND (React/Vite)
# Archivo: conf.d/locations/frontend.conf
# Maneja archivos estáticos y SPA routing
# =====================================================

location / {
    # -------------------------------------------------
    # RATE LIMITING
    # -------------------------------------------------
    # Limita a 50 req/s por IP con burst de 100
    limit_req zone=req_per_ip burst=100 nodelay;
    
    # Máximo 30 conexiones simultáneas por IP
    limit_conn conn_per_ip 30;
    
    # -------------------------------------------------
    # PROXY AL FRONTEND
    # -------------------------------------------------
    proxy_pass http://frontend_servers;
    
    # HTTP/1.1 para keep-alive
    proxy_http_version 1.1;
    
    # Headers
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    
    # -------------------------------------------------
    # CACHE DE ARCHIVOS ESTÁTICOS
    # -------------------------------------------------
    proxy_cache_valid 200 1d;
    proxy_cache_valid 404 1m;
    
    # -------------------------------------------------
    # REINTENTOS
    # -------------------------------------------------
    proxy_next_upstream error timeout http_500 http_502 http_503;
    proxy_next_upstream_tries 3;
}

# =====================================================
# LOCATION: ASSETS ESTÁTICOS CON CACHE LARGO
# =====================================================
location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
    proxy_pass http://frontend_servers;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    
    # Cache agresivo para assets (1 año)
    expires 1y;
    add_header Cache-Control "public, immutable";
    
    # Rate limiting relajado para assets estáticos
    limit_req zone=req_per_ip burst=500 nodelay;
}
