# =====================================================
# LOCATION: HEALTH CHECKS Y MONITOREO
# Archivo: conf.d/locations/health.conf
# Endpoints para Docker/Kubernetes healthchecks
# =====================================================

# -------------------------------------------------
# HEALTH CHECK PRINCIPAL (para Docker)
# -------------------------------------------------
location /health {
    access_log off;
    return 200 "healthy\n";
    add_header Content-Type text/plain;
}

# Alias para nginx-health (usado en docker-compose)
location /nginx-health {
    access_log off;
    return 200 "nginx-ok\n";
    add_header Content-Type text/plain;
}

# -------------------------------------------------
# NGINX STATUS (métricas básicas)
# -------------------------------------------------
location /nginx-status {
    stub_status on;
    access_log off;
    
    # Solo accesible desde localhost y red Docker
    allow 127.0.0.1;
    allow 172.0.0.0/8;
    allow 10.0.0.0/8;
    allow 192.168.0.0/16;
    deny all;
}

# -------------------------------------------------
# READY CHECK (verifica backends)
# -------------------------------------------------
location /ready {
    access_log off;
    proxy_pass http://backend_api/api/v1/health;
    proxy_connect_timeout 5s;
    proxy_read_timeout 5s;
}
