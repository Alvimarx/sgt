# =====================================================
# LOCATION: API BACKEND
# Archivo: conf.d/locations/api.conf
# Maneja todas las rutas /api/*
# =====================================================

location /api/ {
    # -------------------------------------------------
    # RATE LIMITING
    # -------------------------------------------------
    # Limita a 100 req/s por IP con burst de 200
    # nodelay: procesa el burst inmediatamente
    limit_req zone=api_limit burst=200 nodelay;
    
    # Máximo 50 conexiones simultáneas por IP
    limit_conn conn_per_ip 50;
    
    # -------------------------------------------------
    # PROXY AL BACKEND
    # -------------------------------------------------
    proxy_pass http://backend_api;
    
    # HTTP/1.1 para keep-alive
    proxy_http_version 1.1;
    
    # Headers para el backend
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
    proxy_set_header Connection "";
    
    # -------------------------------------------------
    # TIMEOUTS
    # -------------------------------------------------
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    
    # -------------------------------------------------
    # BUFFERS
    # -------------------------------------------------
    proxy_buffer_size 4k;
    proxy_buffers 8 16k;
    proxy_busy_buffers_size 24k;
    
    # -------------------------------------------------
    # MANEJO DE ERRORES Y REINTENTOS
    # -------------------------------------------------
    # Si un backend falla, intenta con otro
    proxy_next_upstream error timeout invalid_header http_500 http_502 http_503;
    proxy_next_upstream_tries 3;
    proxy_next_upstream_timeout 10s;
    
}

# =====================================================
# LOCATION: WEBSOCKETS (si se necesitan)
# =====================================================
location /api/ws/ {
    proxy_pass http://backend_api;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 86400;
}
