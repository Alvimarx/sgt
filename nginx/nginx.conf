# Número de workers = número de CPUs
worker_processes auto;

# Límite de archivos abiertos por worker
worker_rlimit_nofile 65535;

# Archivo de PID
pid /var/run/nginx.pid;

# =====================================================
# EVENTOS
# =====================================================
events {
    # Conexiones simultáneas por worker
    worker_connections 4096;
    
    # Usar epoll para Linux (más eficiente)
    use epoll;
    
    # Aceptar múltiples conexiones a la vez
    multi_accept on;
}

# =====================================================
# HTTP
# =====================================================
http {
    # -------------------------------------------------
    # CONFIGURACIÓN BÁSICA
    # -------------------------------------------------
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    
    # Ocultar versión de nginx (seguridad)
    server_tokens off;
    
    # -------------------------------------------------
    # LOGGING
    # -------------------------------------------------
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'upstream: $upstream_addr rt: $upstream_response_time';
    
    log_format json escape=json '{'
        '"time": "$time_iso8601",'
        '"remote_addr": "$remote_addr",'
        '"request": "$request",'
        '"status": "$status",'
        '"body_bytes_sent": "$body_bytes_sent",'
        '"upstream_addr": "$upstream_addr",'
        '"upstream_response_time": "$upstream_response_time",'
        '"request_time": "$request_time"'
    '}';
    
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;
    
    # -------------------------------------------------
    # OPTIMIZACIÓN DE RENDIMIENTO
    # -------------------------------------------------
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    
    # Timeouts
    keepalive_timeout 65;
    keepalive_requests 1000;
    client_body_timeout 30;
    client_header_timeout 30;
    send_timeout 30;
    
    # Buffers
    client_body_buffer_size 16k;
    client_max_body_size 50m;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 32k;
    
    # -------------------------------------------------
    # COMPRESIÓN GZIP
    # -------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1000;
    gzip_types 
        text/plain 
        text/css 
        text/xml 
        application/json 
        application/javascript 
        application/xml+rss 
        application/atom+xml 
        image/svg+xml;
    
    # -------------------------------------------------
    # RATE LIMITING (Protección DDoS)
    # -------------------------------------------------
    # Zona para frontend: 50 req/s por IP
    limit_req_zone $binary_remote_addr zone=req_per_ip:10m rate=50r/s;
    
    # Zona para API: 100 req/s por IP
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/s;
    
    # Zona para conexiones simultáneas
    limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;
    
    # Respuesta cuando se excede el límite
    limit_req_status 429;
    limit_conn_status 429;
    
    # =====================================================
    # INCLUIR UPSTREAMS (Servidores Backend y Frontend)
    # =====================================================
    include /etc/nginx/conf.d/upstreams/*.conf;
    
    # =====================================================
    # SERVIDOR PRINCIPAL (Puerto 80)
    # =====================================================
    server {
        listen 80;
        listen [::]:80;
        server_name localhost _;
        
        # Headers de seguridad
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        
        # =====================================================
        # INCLUIR LOCATIONS (API, Frontend, Health)
        # =====================================================
        include /etc/nginx/conf.d/locations/*.conf;
        
        # =====================================================
        # MANEJO DE ERRORES
        # =====================================================
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
            internal;
        }
        
        error_page 429 @rate_limit;
        location @rate_limit {
            default_type application/json;
            return 429 '{"error": "Too Many Requests", "message": "Por favor espere un momento", "retry_after": 1}';
        }
    }
    
}
