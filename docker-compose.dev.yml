version: "3.8"
services:
  db:
    image: mysql:8.0
    container_name: huap-dev-db
    environment:
      - MYSQL_ROOT_PASSWORD=huap1234
      - MYSQL_DATABASE=innhosp2
      - MYSQL_ROOT_HOST=%
    ports:
      - "3307:3306"
    volumes:
      - huap-dev-db-data:/var/lib/mysql
    networks:
      - huap-dev-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-phuap1234"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  backend:
    build:
      context: ./huap_backend
      dockerfile: Dockerfile
    container_name: huap-backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://db:3306/innhosp2
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=huap1234
      - SPRING_JPA_HIBERNATE_DDL-AUTO=update
      - JWT_SECRET=***JWT_SECRET_PURGADO***
      - SERVER_ID=backend-dev
    depends_on:
      db:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    networks:
      - huap-dev-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/api/v2/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  db-init:
      image: mysql:8.0
      container_name: huap-dev-db-init
      restart: "no"
      volumes:
        - ./BaseDatosMySQL:/scripts:ro
      command:
        - sh
        - -c
        - | 
          echo "1. Esperando a que MySQL acepte conexiones en la red de Docker...";
          until mysql -h db -uroot -phuap1234 innhosp2 -e "SELECT 1" >/dev/null 2>&1; do
            sleep 2;
          done;

          echo "2. Validando si la tabla viewpersonal ya existe y tiene registros...";
          # Verificamos si la tabla existe y cuántas filas tiene de forma segura
          COUNT=$$(mysql -h db -uroot -phuap1234 innhosp2 -se "SELECT COUNT(*) FROM viewpersonal" 2>/dev/null || echo 0);
          
          if [ "$$COUNT" = "0" ]; then
            echo "3. La tabla no existe o está vacía. Ejecutando script de poblado...";
            mysql -h db -uroot -phuap1234 innhosp2 < /scripts/setup_personal_aux.sql &&
            mysql -h db -uroot -phuap1234 innhosp2 < /scripts/poblar_personal_aux_dev.sql;
            echo "¡Poblado finalizado con éxito!";
          else
            echo "3. Omitiendo seed: La base de datos ya contiene datos ($$COUNT funcionarios).";
          fi
      depends_on:
        db:
          condition: service_healthy
      networks:
        - huap-dev-network

  db-seeder:
    image: mysql:8.0
    container_name: huap-dev-seeder
    restart: "no"
    volumes:
      - ./BaseDatosMySQL:/scripts:ro
    command:
      - sh
      - -c
      - |
        COUNT=$$(mysql -h db -uroot -phuap1234 innhosp2 -se 'SELECT COUNT(*) FROM Funcionario' 2>/dev/null || echo 0);
        if [ "$$COUNT" = "0" ]; then
          echo "BD vacia, ejecutando seed...";
          mysql -h db -uroot -phuap1234 innhosp2 < /scripts/poblar_innhosp2.sql 
        else
          echo "BD ya tiene datos ($$COUNT funcionarios), omitiendo seed.";
        fi
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - huap-dev-network

  frontend:
    build:
      context: ./sgt-huap_frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=http://localhost:8080/api/v2
    container_name: huap-frontend
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - huap-dev-network

networks:
  huap-dev-network:
    driver: bridge

volumes:
  huap-dev-db-data:
